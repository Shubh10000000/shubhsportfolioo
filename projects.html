
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Shubh Srivastava</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f3fa;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            background-color: rgb(49, 16, 95);
            align-items: center;
            padding: 10px;
            gap: 20px;
        }

        nav a {
            color: gray;
            font-style: italic;
            font-size: large;
            text-decoration: none;
        }

        nav h1 {
            margin-left: auto;
            color: white;
        }

        .projects {
            margin: 20px;
            border: 1px solid #ddd;
            width: 250px;
            padding: 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 15px rgba(49, 16, 95, 0.12);
            transition: 0.3s ease;
        }

        .projects:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(49, 16, 95, 0.22);
            border-color: rgb(49, 16, 95);
        }

        .projects a {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(49, 16, 95);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .projects a:hover {
            background-color: rgb(83, 43, 139);
        }

        .projects h2 {
            text-align: center;
            color: rgb(49, 16, 95);
        }
    </style>
</head>

    <main class="main">

        <nav>
